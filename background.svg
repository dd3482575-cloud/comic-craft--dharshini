<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9eef0"/>
      <stop offset="0.55" stop-color="#f3d9cc"/>
      <stop offset="1" stop-color="#e8b9a5"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fa3b8"/><stop offset="1" stop-color="#a9cbd6"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f7f96"/><stop offset="1" stop-color="#7fb0c0"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a9aa4"/><stop offset="1" stop-color="#d79a78"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.55"/>
    </linearGradient>
    <g id="pine">
      <polygon points="0,-90 22,-45 10,-45 30,-5 12,-5 34,35 -34,35 -12,-5 -30,-5 -10,-45 -22,-45" />
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- distant cliffs -->
  <path d="M0 330 L120 250 L300 170 L470 210 L560 330 L560 620 L0 620 Z" fill="url(#far)"/>
  <path d="M1040 620 L1040 280 L1150 190 L1260 210 L1330 260 L1440 220 L1600 300 L1600 620 Z" fill="url(#far)"/>

  <!-- mid ridges -->
  <path d="M0 420 L160 330 L330 390 L520 360 L700 470 L900 420 L1100 480 L1300 400 L1450 450 L1600 380 L1600 640 L0 640 Z" fill="url(#mid)" opacity="0.85"/>
  <rect y="380" width="1600" height="260" fill="url(#mist)"/>

  <!-- distant pines -->
  <g fill="#2d5f74" opacity="0.75">
    <use href="#pine" transform="translate(120 520) scale(1.1)"/>
    <use href="#pine" transform="translate(220 540) scale(0.9)"/>
    <use href="#pine" transform="translate(330 510) scale(1.3)"/>
    <use href="#pine" transform="translate(1240 520) scale(1.2)"/>
    <use href="#pine" transform="translate(1350 500) scale(1.5)"/>
    <use href="#pine" transform="translate(1470 530) scale(1.1)"/>
  </g>
  <!-- foreground pines -->
  <g fill="#1e4a5d">
    <use href="#pine" transform="translate(60 610) scale(2.2)"/>
    <use href="#pine" transform="translate(200 640) scale(1.7)"/>
    <use href="#pine" transform="translate(1500 600) scale(2.4)"/>
    <use href="#pine" transform="translate(1380 650) scale(1.8)"/>
  </g>

  <!-- meadow + river -->
  <rect y="650" width="1600" height="60" fill="#5f8a70" opacity="0.8"/>
  <rect y="690" width="1600" height="210" fill="url(#water)"/>
  <g fill="#3c4a4f" opacity="0.8">
    <ellipse cx="300" cy="820" rx="60" ry="14"/><ellipse cx="520" cy="860" rx="80" ry="16"/>
    <ellipse cx="800" cy="830" rx="50" ry="12"/><ellipse cx="1040" cy="865" rx="90" ry="17"/>
    <ellipse cx="1290" cy="825" rx="55" ry="13"/>
  </g>
</svg>
