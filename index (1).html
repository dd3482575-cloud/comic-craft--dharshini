<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComicCraft</title>
</head>
<body>

    <h1>ComicCraft - AI Comic Story Creator</h1>

    <form action="/generate" method="post">
        <label for="story">Enter your story:</label>
        <br><br>
        <textarea id="story" name="story" rows="10" cols="50"
                  placeholder="Enter your comic story here"></textarea>
        <br><br>
        <button type="submit">Generate Comic</button>
    </form>

</body>
</html>
